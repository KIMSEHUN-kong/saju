
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사주팔자</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <button id="theme-toggle" aria-label="테마 변경">
                <span class="icon-sun">☀️</span>
                <span class="icon-moon">🌙</span>
            </button>
            <h1>사주팔자 운세</h1>
            <p>당신의 인생을 비추는 동양의 지혜</p>
        </header>
        <main>
            <div class="input-section">
                <h2>생년월일시를 입력하세요</h2>
                <div class="input-grid">
                    <input type="number" id="year" placeholder="태어난 해 (YYYY)" aria-label="태어난 해">
                    <input type="number" id="month" placeholder="월" aria-label="태어난 월">
                    <input type="number" id="day" placeholder="일" aria-label="태어난 일">
                    <input type="number" id="hour" placeholder="시" aria-label="태어난 시">
                </div>
                <button id="submit-btn">운세 확인</button>
            </div>
            <div id="result" class="result-section" aria-live="polite">
                <!-- 운세 결과가 여기에 표시됩니다 -->
            </div>
        </main>
    </div>
    <script src="main.js"></script>
</body>
</html>
