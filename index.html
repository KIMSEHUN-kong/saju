<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사주팔자 운세</title>
    <link rel="stylesheet" href="style.css">
    <meta name="description" content="생년월일시로 보는 무료 사주팔자 운세 - 재물운, 연애운, 직업운을 확인하세요">
    <meta property="og:title" content="사주팔자 운세">
    <meta property="og:description" content="당신의 인생을 비추는 동양의 지혜">
</head>
<body>
    <div class="container">
        <header>
            <button id="theme-toggle" aria-label="테마 변경">
                <span class="icon-sun">☀️</span>
                <span class="icon-moon">🌙</span>
            </button>
            <h1>사주팔자 운세</h1>
            <p>당신의 인생을 비추는 동양의 지혜</p>
        </header>

        <!-- 입력 섹션 -->
        <section id="input-section" class="input-section">
            <h2>생년월일시를 입력하세요</h2>
            <div class="input-grid">
                <div class="input-group">
                    <label for="year">태어난 해</label>
                    <input type="number" id="year" placeholder="예: 1990" min="1900" max="2030">
                </div>
                <div class="input-group">
                    <label for="month">월</label>
                    <input type="number" id="month" placeholder="1-12" min="1" max="12">
                </div>
                <div class="input-group">
                    <label for="day">일</label>
                    <input type="number" id="day" placeholder="1-31" min="1" max="31">
                </div>
                <div class="input-group">
                    <label for="hour">시</label>
                    <input type="number" id="hour" placeholder="0-23" min="0" max="23">
                </div>
            </div>
            <button id="submit-btn">🔮 사주 보기</button>
        </section>

        <!-- 결과 섹션 -->
        <section id="result-section" class="result-section" style="display: none;">

            <!-- 1. 사주 원국 카드 -->
            <div class="saju-cards">
                <h2>📜 당신의 사주 원국</h2>
                <div class="pillar-container" id="pillar-container">
                    <!-- JS로 생성 -->
                </div>
                <div class="one-line-summary" id="one-line-summary">
                    <!-- JS로 생성 -->
                </div>
            </div>

            <!-- 2. 오행 에너지 그래프 -->
            <div class="energy-section">
                <h2>⚡ 오행 에너지 분석</h2>
                <div class="energy-bars" id="energy-bars">
                    <!-- JS로 생성 -->
                </div>
                <p class="energy-description" id="energy-description"></p>
            </div>

            <!-- 광고 영역 1 -->
            <div class="ad-placeholder">
                <span>광고 영역</span>
            </div>

            <!-- 3. 핵심 운세 풀이 (아코디언) -->
            <div class="fortune-section">
                <h2>🌟 3대 핵심 운세</h2>

                <div class="accordion">
                    <div class="accordion-item">
                        <button class="accordion-header" data-target="wealth">
                            <span>💰 재물운</span>
                            <span class="accordion-icon">▼</span>
                        </button>
                        <div class="accordion-content" id="wealth">
                            <p id="wealth-content"></p>
                        </div>
                    </div>

                    <div class="accordion-item">
                        <button class="accordion-header" data-target="love">
                            <span>❤️ 연애·인간관계</span>
                            <span class="accordion-icon">▼</span>
                        </button>
                        <div class="accordion-content" id="love">
                            <p id="love-content"></p>
                        </div>
                    </div>

                    <div class="accordion-item">
                        <button class="accordion-header" data-target="career">
                            <span>💼 직업·성공운</span>
                            <span class="accordion-icon">▼</span>
                        </button>
                        <div class="accordion-content" id="career">
                            <p id="career-content"></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 4. 오늘의 행운 가이드 -->
            <div class="luck-guide">
                <h2>🍀 오늘의 행운 가이드</h2>
                <div class="luck-grid" id="luck-grid">
                    <!-- JS로 생성 -->
                </div>
                <div class="daily-advice" id="daily-advice">
                    <!-- JS로 생성 -->
                </div>
            </div>

            <!-- 광고 영역 2 -->
            <div class="ad-placeholder">
                <span>광고 영역</span>
            </div>

            <!-- 5. CTA 섹션 -->
            <div class="cta-section">
                <button class="cta-btn" id="share-kakao">
                    💬 카카오톡 공유
                </button>
                <button class="cta-btn secondary" id="copy-link">
                    🔗 링크 복사
                </button>
                <button class="cta-btn outline" id="retry-btn">
                    🔄 다시 보기
                </button>
            </div>
        </section>
    </div>

    <script src="main.js"></script>
</body>
</html>
